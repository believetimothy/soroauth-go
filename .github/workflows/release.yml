name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # required for keyless cosign signing via Sigstore OIDC

jobs:
  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci
      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs
      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors; then
            echo
            echo "The committed golden vectors differ from freshly generated ones."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            exit 1
          fi

  build:
    name: build binaries
    needs: golden-drift
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary_name=soroauth
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary_name=soroauth.exe
          fi
          go build -ldflags="-s -w" -o "${binary_name}" ./cmd/soroauth
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soroauth-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            soroauth
            soroauth.exe
          retention-days: 1

  image:
    name: build, publish, and sign container image
    needs: golden-drift
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image tags
        id: tags
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/soroauth/soroauth-go:${{ steps.tags.outputs.version }}
            ghcr.io/soroauth/soroauth-go:latest
          # The digest in the output is used by the cosign sign step below so
          # that the signature is bound to the exact digest pushed, not a tag
          # (tags are mutable; digests are not).

      # Keyless cosign signing uses the GitHub Actions OIDC token to produce a
      # short-lived certificate from Sigstore's Fulcio CA, which is then
      # recorded in the Rekor transparency log. No long-lived signing key is
      # stored anywhere; the certificate identity is the workflow's OIDC claim.
      - name: install cosign
        run: |
          version="v2.4.1"
          url="https://github.com/sigstore/cosign/releases/download/${version}/cosign-linux-amd64"
          checksum="e3f72e4a4e8a4cd5a8e0025c26b3d4c72a9d7d82b6bfae0e2f92d35e4a0c9e1a"
          curl -fsSLo /usr/local/bin/cosign "${url}"
          # Verify the downloaded binary matches the expected checksum.
          echo "${checksum}  /usr/local/bin/cosign" | sha256sum --check || {
            echo "cosign checksum mismatch — download may have been tampered with" >&2
            exit 1
          }
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: sign container image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/soroauth/soroauth-go@${{ steps.push.outputs.digest }}"

  sbom:
    name: generate and sign SBOMs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Install syft from the official release. The version is pinned and the
      # checksum is verified before execution so a compromised CDN cannot inject
      # a modified binary into the SBOM generation step.
      - name: install syft
        run: |
          version="1.18.1"
          url="https://github.com/anchore/syft/releases/download/v${version}/syft_${version}_linux_amd64.tar.gz"
          checksum="f7b3cf827e4d5eab74a82294d3e5c0ab67b3b5e43c0d5a8c7fbb0b19df5bef42"
          curl -fsSLo /tmp/syft.tar.gz "${url}"
          echo "${checksum}  /tmp/syft.tar.gz" | sha256sum --check || {
            echo "syft checksum mismatch" >&2
            exit 1
          }
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft version

      - name: install cosign
        run: |
          version="v2.4.1"
          url="https://github.com/sigstore/cosign/releases/download/${version}/cosign-linux-amd64"
          checksum="e3f72e4a4e8a4cd5a8e0025c26b3d4c72a9d7d82b6bfae0e2f92d35e4a0c9e1a"
          curl -fsSLo /usr/local/bin/cosign "${url}"
          echo "${checksum}  /usr/local/bin/cosign" | sha256sum --check || {
            echo "cosign checksum mismatch" >&2
            exit 1
          }
          chmod +x /usr/local/bin/cosign
          cosign version

      # Generate a CycloneDX JSON SBOM for every release binary and sign each
      # one with cosign keyless signing. The bundle file (.sbom.json.bundle)
      # contains the certificate and the Rekor log entry, which is what
      # `cosign verify-blob --bundle` checks during verification.
      - name: generate and sign SBOMs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mkdir -p sbom-output

          for artifact_dir in artifacts/soroauth-*/; do
            platform="${artifact_dir#artifacts/}"
            platform="${platform%/}"

            # Find the binary (soroauth or soroauth.exe)
            binary=""
            for candidate in "${artifact_dir}soroauth" "${artifact_dir}soroauth.exe"; do
              if [ -f "${candidate}" ]; then
                binary="${candidate}"
                break
              fi
            done
            if [ -z "${binary}" ]; then
              echo "no binary found in ${artifact_dir}" >&2
              exit 1
            fi

            sbom_file="sbom-output/${platform}.sbom.json"

            echo "generating SBOM for ${platform} from ${binary}"
            syft "${binary}" \
              --output cyclonedx-json="${sbom_file}" \
              --source-name "soroauth" \
              --source-version "${GITHUB_REF_NAME}"

            echo "signing SBOM for ${platform}"
            cosign sign-blob --yes \
              --bundle "${sbom_file}.bundle" \
              "${sbom_file}"

            echo "generated: ${sbom_file} and ${sbom_file}.bundle"
          done

          ls -lh sbom-output/

      - name: upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-output/
          retention-days: 1

  release:
    name: create release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: prepare release notes
        id: notes
        run: |
          # Extract the section for this tag from CHANGELOG.md
          tag="${GITHUB_REF_NAME}"
          # Find the section for this version (e.g., ## [0.1.0] — 2026-09-16)
          # and everything until the next version header or EOF
          awk -v tag="$tag" '
            /^## \[/ { if (found && !printed) exit; if ($0 ~ "\\[" substr(tag, 2) "\\]") found=1 }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Could not find release notes for $tag in CHANGELOG.md" >&2
            exit 1
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/soroauth-linux-amd64/soroauth
            artifacts/soroauth-linux-arm64/soroauth
            artifacts/soroauth-darwin-amd64/soroauth
            artifacts/soroauth-darwin-arm64/soroauth
            artifacts/soroauth-windows-amd64/soroauth.exe
            artifacts/sbom/*.sbom.json
            artifacts/sbom/*.sbom.json.bundle
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
